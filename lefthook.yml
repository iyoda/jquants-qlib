pre-commit:
  parallel: true
  jobs:
    - name: ruff
      glob: "*.py"
      run: '"${JQQLIB_PYTHON:-.venv/bin/python}" -m ruff check {staged_files}'
    - name: comments-and-docstrings
      glob: "*.py"
      run: '"${JQQLIB_PYTHON:-.venv/bin/python}" scripts/check_comments.py {staged_files}'
    - name: conventions
      run: '"${JQQLIB_PYTHON:-.venv/bin/python}" scripts/check_conventions.py --staged'

pre-push:
  parallel: true
  jobs:
    - name: no-hand-pushed-tags
      use_stdin: true
      run: '"${JQQLIB_PYTHON:-.venv/bin/python}" scripts/check_conventions.py --pre-push'
    - name: mypy
      run: '"${JQQLIB_PYTHON:-.venv/bin/python}" -m mypy'
    - name: unittest
      run: >-
        env -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_CONFIG -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_OBJECT_DIRECTORY -u GIT_DIR -u GIT_WORK_TREE -u GIT_IMPLICIT_WORK_TREE -u GIT_GRAFT_FILE -u GIT_INDEX_FILE -u GIT_NO_REPLACE_OBJECTS -u GIT_REPLACE_REF_BASE -u GIT_PREFIX -u GIT_SHALLOW_FILE -u GIT_COMMON_DIR
        "${JQQLIB_PYTHON:-.venv/bin/python}" -m unittest discover -s tests
