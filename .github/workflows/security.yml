name: Dependency security

on:
  pull_request:
  push:
    branches: [dev, master]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/runtime/bin/python" -m pip install -e .
          python -m venv "$RUNNER_TEMP/auditor"
          "$RUNNER_TEMP/auditor/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/auditor/bin/pip-audit" --path "$RUNNER_TEMP/runtime/lib/python3.12/site-packages" --skip-editable
