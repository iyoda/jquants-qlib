name: Release

# A release is a merge into `master`: the workflow reads `[project].version` from
# pyproject.toml and, when the tag `vX.Y.Z` does not exist yet AND CHANGELOG.md has a
# `## [X.Y.Z]` section, it builds, verifies, optionally publishes to PyPI, and creates the
# GitHub Release (which creates the tag). Any other merge into `master` is a no-op here.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'iyoda/jquants-qlib'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the release tag from pyproject.toml
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(python3 - <<'PYCODE'
          import tomllib
          with open("pyproject.toml", "rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PYCODE
          )"
          tag="v${version}"
          release=true
          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; nothing to release."
            release=false
          elif ! grep -qE "^## \[${version//./\\.}\]" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no '## [${version}]' section; not releasing ${tag}. Add the section (and CITATION.cff date-released) to release."
            release=false
          else
            echo "Tag ${tag} does not exist and CHANGELOG has a [${version}] section; releasing."
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Check installed version matches the release tag
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          python - <<'PYCODE'
          import os
          from importlib.metadata import version
          expected = "v" + version("jquants-qlib")
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}")
          PYCODE
      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          python - <<'PYCODE'
          import os
          import re
          from pathlib import Path
          release_version = os.environ["RELEASE_TAG"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(release_version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no '## [{release_version}]' section")
          notes = match.group(1).strip() + "\n"
          if not notes.strip():
              raise SystemExit(f"CHANGELOG.md section '## [{release_version}]' is empty")
          Path(os.environ["RUNNER_TEMP"], "notes.md").write_text(notes, encoding="utf-8")
          print(notes)
          PYCODE
      - run: python -m unittest discover -s tests
      - run: ruff check .
      - run: mypy
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Rebuild wheel from sdist
        run: python -m pip wheel dist/*.tar.gz --no-deps -w "$RUNNER_TEMP/rebuild"
      - name: Install both wheels in fresh environments
        run: |
          python -m venv "$RUNNER_TEMP/venv-wheel"
          "$RUNNER_TEMP/venv-wheel/bin/python" -m pip install dist/*.whl
          python -m venv "$RUNNER_TEMP/venv-sdist"
          "$RUNNER_TEMP/venv-sdist/bin/python" -m pip install "$RUNNER_TEMP"/rebuild/*.whl
      # No PYTHONPATH on purpose: jqqlib must resolve from the installed wheel only.
      # The smoke also checks `jqqlib --version` and the `py.typed` marker.
      - name: Smoke original wheel outside checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/dist_smoke.py"
      - name: Smoke sdist-rebuilt wheel outside checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv-sdist/bin/python" "$GITHUB_WORKSPACE/scripts/dist_smoke.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  pypi:
    # Opt-in: set the repository variable PUBLISH_TO_PYPI to "true" (Settings → Secrets and
    # variables → Actions → Variables) once the PyPI trusted publisher and the `pypi`
    # environment exist. Until then the job is skipped and the release is GitHub-only.
    if: needs.version.outputs.release == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    # Runs after a successful build when the PyPI job either succeeded or was skipped
    # (PUBLISH_TO_PYPI unset). A failed PyPI upload still blocks the GitHub Release.
    if: >-
      always() && github.repository == 'iyoda/jquants-qlib'
      && needs.version.outputs.release == 'true'
      && needs.build.result == 'success'
      && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    needs: [version, build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes
      - name: Create the GitHub Release (creates the tag) and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --target "$TARGET_SHA" \
              --title "$RELEASE_TAG" --notes-file notes/notes.md
          fi
