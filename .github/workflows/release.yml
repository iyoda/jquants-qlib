name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'iyoda/jquants-qlib'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYCODE'
          import os
          from importlib.metadata import version
          expected = "v" + version("jquants-qlib")
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}")
          PYCODE
      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYCODE'
          import os
          import re
          from pathlib import Path
          release_version = os.environ["RELEASE_TAG"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(release_version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no '## [{release_version}]' section")
          notes = match.group(1).strip() + "\n"
          if not notes.strip():
              raise SystemExit(f"CHANGELOG.md section '## [{release_version}]' is empty")
          Path(os.environ["RUNNER_TEMP"], "notes.md").write_text(notes, encoding="utf-8")
          print(notes)
          PYCODE
      - run: python -m unittest discover -s tests
      - run: ruff check .
      - run: mypy
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Rebuild wheel from sdist
        run: python -m pip wheel dist/*.tar.gz --no-deps -w "$RUNNER_TEMP/rebuild"
      - name: Install both wheels in fresh environments
        run: |
          python -m venv "$RUNNER_TEMP/venv-wheel"
          "$RUNNER_TEMP/venv-wheel/bin/python" -m pip install dist/*.whl
          python -m venv "$RUNNER_TEMP/venv-sdist"
          "$RUNNER_TEMP/venv-sdist/bin/python" -m pip install "$RUNNER_TEMP"/rebuild/*.whl
      # No PYTHONPATH on purpose: jqqlib must resolve from the installed wheel only.
      # The smoke also checks `jqqlib --version` and the `py.typed` marker.
      - name: Smoke original wheel outside checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/dist_smoke.py"
      - name: Smoke sdist-rebuilt wheel outside checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv-sdist/bin/python" "$GITHUB_WORKSPACE/scripts/dist_smoke.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  pypi:
    # Opt-in: set the repository variable PUBLISH_TO_PYPI to "true" (Settings → Secrets and
    # variables → Actions → Variables) once the PyPI trusted publisher and the `pypi`
    # environment exist. Until then the job is skipped and the release is GitHub-only.
    if: github.repository == 'iyoda/jquants-qlib' && vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    # Runs after a successful build when the PyPI job either succeeded or was skipped
    # (PUBLISH_TO_PYPI unset). A failed PyPI upload still blocks the GitHub Release.
    if: >-
      always() && github.repository == 'iyoda/jquants-qlib'
      && needs.build.result == 'success'
      && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: notes
      - name: Attach distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag \
              --title "$RELEASE_TAG" --notes-file notes/notes.md
          fi
