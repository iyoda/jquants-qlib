name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Smoke
        run: jqqlib --help && jqqlib --version
      - name: Test
        run: python -m unittest discover -s tests -v

  lint:
    name: lint + type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy

  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Assert sdist members
        run: |
          python - <<'PY'
          import glob
          import tarfile

          archives = glob.glob("dist/*.tar.gz")
          if len(archives) != 1:
              raise SystemExit(f"expected one sdist, found {archives}")
          required = (
              "tests/",
              "scripts/",
              "docs/",
              "CHANGELOG.md",
              "config.example.yaml",
              "THIRD_PARTY_NOTICES.md",
          )
          with tarfile.open(archives[0], "r:gz") as archive:
              names = archive.getnames()

          def present(member: str) -> bool:
              needle = member.rstrip("/")
              for name in names:
                  rest = name.split("/", 1)[-1]
                  if rest == needle or rest.startswith(needle + "/"):
                      return True
              return False

          missing = [item for item in required if not present(item)]
          if missing:
              raise SystemExit(f"sdist missing members: {missing}")
          print("sdist members OK:", ", ".join(required))
          PY
      - name: Unittest from extracted sdist
        run: |
          mkdir -p "$RUNNER_TEMP/sdist-src"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist-src"
          SDIST_ROOT="$(python -c "import pathlib,sys; roots=[p for p in pathlib.Path(sys.argv[1]).iterdir() if p.is_dir()]; assert len(roots)==1, roots; print(roots[0])" "$RUNNER_TEMP/sdist-src")"
          python -m venv "$RUNNER_TEMP/venv-sdist-tests"
          "$RUNNER_TEMP/venv-sdist-tests/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv-sdist-tests/bin/python" -m pip install "${SDIST_ROOT}[dev]"
          (cd "$SDIST_ROOT" && "$RUNNER_TEMP/venv-sdist-tests/bin/python" -m unittest discover -s tests)
      - name: Rebuild wheel from sdist
        run: python -m pip wheel dist/*.tar.gz --no-deps -w "$RUNNER_TEMP/rebuild"
      - name: Install both wheels in fresh environments
        run: |
          python -m venv "$RUNNER_TEMP/venv-wheel"
          "$RUNNER_TEMP/venv-wheel/bin/python" -m pip install dist/*.whl
          python -m venv "$RUNNER_TEMP/venv-sdist"
          "$RUNNER_TEMP/venv-sdist/bin/python" -m pip install "$RUNNER_TEMP"/rebuild/*.whl
      # No PYTHONPATH on purpose: the smoke must resolve jqqlib from the installed
      # wheel only, and it exercises the inline CSV fallback (tests/ is not shipped).
      - name: Smoke original wheel outside checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/dist_smoke.py"
      - name: Smoke sdist-rebuilt wheel outside checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv-sdist/bin/python" "$GITHUB_WORKSPACE/scripts/dist_smoke.py"
